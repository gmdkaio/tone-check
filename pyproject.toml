[project]
name = "tonecheck"
version = "0.1.0"
description = "How well can models hear Mandarin tones, and where do they fail?"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "librosa",
    "praat-parselmouth",
    "soundfile",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyter", "ipykernel"]
neural = ["torch", "torchaudio", "transformers", "accelerate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
